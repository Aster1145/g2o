; PlatformIO project for the ESP32 <-> RPLIDAR bridge.
;   pio run -t upload
;   pio device monitor
;
; If you use the Arduino IDE instead, just open esp32_rplidar_bridge.ino -
; it works there too (keep rplidar_parser.h in the same folder).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The default ESP32 core (Arduino-ESP32 3.x) is fine.  If you hit problems
; with analogWrite() on an old core, pin the version:
; platform_packages = platformio/espressif32 @ 6.5.0
