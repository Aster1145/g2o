[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "room-slam"
version = "0.1.0"
description = "2D SLAM for a differential-drive robot with an RPLIDAR, an ESP32 and g2o"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
g2o = ["g2o-python>=0.0.12"]
dev = ["pytest>=7"]

[project.scripts]
room-slam-record = "slam2d.record:main"
room-slam-map = "slam2d.run_slam:main"
room-slam-demo = "slam2d.simulate_room:main"
room-slam-replay = "slam2d.replay:main"
room-slam-check = "slam2d.check_stream:main"
room-slam-sql = "slam2d.dbquery:main"

[tool.setuptools.packages.find]
include = ["slam2d*"]
